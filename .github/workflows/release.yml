name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Tạo sẵn release draft: electron-builder upload song song, nếu chưa có release sẽ tự tạo trùng nhiều cái (race)
      - name: Create draft release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bản chỉ-code cho máy đã cài: updater tải file này thay vì cả bộ cài (khi dependencies không đổi)
      # Có cả subswap/ (cùng bộ lọc như extraResources): code hot-update tìm subswap cạnh src/ (xem ensureSubEnv)
      - name: Upload code-only update
        shell: bash
        run: |
          tar -czf code.tgz package.json src subswap/*.py subswap/config.yaml subswap/requirements.txt
          gh release upload "$GITHUB_REF_NAME" code.tgz --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
